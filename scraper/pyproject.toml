[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theface-scraper"
version = "0.1.0"
description = "Archive Olive Pometsey's articles from theface.com."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "brotli>=1.1",
    "lxml>=5.0",
    "pillow>=10.0",
    "playwright>=1.44",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.scripts]
theface-scraper = "scrape:main"

[tool.setuptools]
py-modules = ["scrape"]

[tool.setuptools.packages.find]
include = ["theface*"]
